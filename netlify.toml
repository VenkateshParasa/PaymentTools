# Static Vite SPA. Optional: deploy only if you want the tools online.
[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev --no-audit --no-fund"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
